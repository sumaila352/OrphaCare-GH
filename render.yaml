# Render Blueprint — OrphaCare API + optional Postgres
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy: set JWT_SECRET, CLOUDINARY_*, CLIENT_URL (Vercel URL),
# and run db:seed once via Shell with SEED_ADMIN_*.

databases:
  - name: orphacare-db
    plan: free
    databaseName: orphacare
    user: orphacare

services:
  - type: web
    name: orphacare-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build:production -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orphacare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: orphacare/children
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
